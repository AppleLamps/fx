name: CDN Backfill

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to backfill (e.g. "v0.3.0") or "all" for every release'
        required: true
        default: "all"
      update-latest:
        description: "Update latest.txt to this version (ignored when version is 'all')"
        type: boolean
        default: false
      dry-run:
        description: "List what would be uploaded without actually uploading"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CDN_BASE: cli
  # platform:archive-extension. Windows ships a .zip; the rest ship .tar.gz.
  PLATFORMS: >-
    linux-x86_64:tar.gz
    linux-aarch64:tar.gz
    macos-x86_64:tar.gz
    macos-aarch64:tar.gz
    windows-x86_64:zip

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.version }}" = "all" ]; then
            VERSIONS=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | sort -V)
          else
            gh release view "${{ inputs.version }}" --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' >/dev/null
            VERSIONS="${{ inputs.version }}"
          fi
          echo "Versions to backfill:"
          echo "$VERSIONS"
          {
            echo "list<<EOF"
            echo "$VERSIONS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Backfill versions to CDN
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          DRY_RUN="${{ inputs.dry-run }}"
          UPLOADED=0
          SKIPPED=0
          FAILED=0

          upload_blob() {
            local local_path="$1"
            local blob_path="$2"
            local content_type="${3:-application/octet-stream}"

            if [ "$DRY_RUN" = "true" ]; then
              echo "  [dry-run] would upload $blob_path"
              return 0
            fi

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PUT "https://blob.vercel-storage.com/${blob_path}" \
              -H "Authorization: Bearer ${BLOB_READ_WRITE_TOKEN}" \
              -H "x-api-version: 7" \
              -H "x-content-type: ${content_type}" \
              -H "x-add-random-suffix: 0" \
              -H "x-cache-control-max-age: 31536000" \
              --data-binary "@${local_path}")

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "  uploaded $blob_path ($HTTP_CODE)"
              return 0
            else
              echo "  FAILED $blob_path ($HTTP_CODE)"
              return 1
            fi
          }

          while IFS= read -r VERSION; do
            [ -z "$VERSION" ] && continue
            echo ""
            echo "=== $VERSION ==="

            TMPDIR=$(mktemp -d)
            trap "rm -rf $TMPDIR" EXIT

            gh release download "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$TMPDIR" \
              --pattern "fx-*.tar.gz" \
              --pattern "fx-*.tar.gz.sha256" \
              --pattern "fx-*.zip" \
              --pattern "fx-*.zip.sha256" 2>/dev/null || {
              echo "  no assets found, skipping"
              SKIPPED=$((SKIPPED + 1))
              rm -rf "$TMPDIR"
              continue
            }

            for ENTRY in $PLATFORMS; do
              PLATFORM="${ENTRY%%:*}"
              EXT="${ENTRY##*:}"
              ARCHIVE="fx-${PLATFORM}.${EXT}"
              CHECKSUM="${ARCHIVE}.sha256"

              case "$EXT" in
                tar.gz) ARCHIVE_TYPE="application/gzip" ;;
                zip)    ARCHIVE_TYPE="application/zip" ;;
                *)      ARCHIVE_TYPE="application/octet-stream" ;;
              esac

              # Releases predating a platform simply have no asset for it, which
              # is a skip and not a failure.
              if [ -f "$TMPDIR/$ARCHIVE" ]; then
                upload_blob "$TMPDIR/$ARCHIVE" "${CDN_BASE}/${VERSION}/${ARCHIVE}" "$ARCHIVE_TYPE" && \
                  UPLOADED=$((UPLOADED + 1)) || FAILED=$((FAILED + 1))
              else
                echo "  missing $ARCHIVE"
                SKIPPED=$((SKIPPED + 1))
              fi

              if [ -f "$TMPDIR/$CHECKSUM" ]; then
                upload_blob "$TMPDIR/$CHECKSUM" "${CDN_BASE}/${VERSION}/${CHECKSUM}" "text/plain" && \
                  UPLOADED=$((UPLOADED + 1)) || FAILED=$((FAILED + 1))
              fi
            done

            rm -rf "$TMPDIR"
            trap - EXIT
          done <<< "${{ steps.versions.outputs.list }}"

          echo ""
          echo "--- Summary ---"
          echo "Uploaded: $UPLOADED"
          echo "Skipped:  $SKIPPED"
          echo "Failed:   $FAILED"

          if [ "$FAILED" -gt 0 ]; then
            exit 1
          fi

      - name: Update latest.txt
        if: inputs.update-latest && inputs.version != 'all' && !inputs.dry-run
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          echo -n "$VERSION" > /tmp/latest.txt
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT "https://blob.vercel-storage.com/${CDN_BASE}/latest.txt" \
            -H "Authorization: Bearer ${BLOB_READ_WRITE_TOKEN}" \
            -H "x-api-version: 7" \
            -H "x-content-type: text/plain" \
            -H "x-add-random-suffix: 0" \
            -H "x-cache-control-max-age: 60" \
            --data-binary "@/tmp/latest.txt")
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Updated latest.txt to $VERSION ($HTTP_CODE)"
          else
            echo "Failed to update latest.txt ($HTTP_CODE)"
            exit 1
          fi
